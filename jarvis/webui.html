<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0e1116">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Jarvis">
<title>Jarvis</title>
<link rel="stylesheet" href="/vendor/katex/katex.min.css">
<style>
  :root { --bg:#0e1116; --panel:#151a22; --panel2:#1b222c; --line:#242c38; --text:#d8dee9; --dim:#8b95a5;
          --you:#6cb6ff; --jarvis:#7ee0a0; --warn:#e5c07b; --bad:#f07178; --ok:#7ee0a0; --stop:#9aa5b5;
          --shadow:0 0 40px rgba(0,0,0,.5); --scrim:rgba(0,0,0,.45); color-scheme: dark; }
  :root[data-theme="light"] { --bg:#f3f5f8; --panel:#ffffff; --panel2:#eef1f5; --line:#d0d7de; --text:#1f2328; --dim:#57606a;
          --you:#0550ae; --jarvis:#1a7f37; --warn:#8a5200; --bad:#c21f2b; --ok:#1a7f37; --stop:#57606a;
          --shadow:0 0 30px rgba(31,35,40,.25); --scrim:rgba(31,35,40,.3); color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; }
  body { background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, "Segoe UI", sans-serif;
         display: flex; flex-direction: column; height: 100vh; height: 100dvh; height: var(--vvh, 100dvh);
         overflow: hidden; overscroll-behavior: none; position: fixed; top: 0; left: 0; right: 0;
         padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  header { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); flex: 0 0 auto; }
  header .status { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; min-width: 0; }
  header .ctrls { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .12em; font-weight: 700; }
  .grow { flex: 1; }
  .pill { padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); font-size: 12px; color: var(--dim); white-space: nowrap; }
  .pill.listening { color: var(--you); border-color: var(--you); }
  .pill.thinking { color: var(--warn); border-color: var(--warn); }
  .pill.speaking { color: var(--jarvis); border-color: var(--jarvis); }
  #conn::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                  background: var(--bad); margin-right: 6px; }
  #conn.on::before { background: var(--ok); }
  #conn.wait::before { background: var(--warn); }
  button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px;
           padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--dim); }
  button:disabled { opacity: .55; cursor: default; }
  button:focus-visible, .task:focus-visible, .tlrow:focus-visible, summary:focus-visible { outline: 2px solid var(--you); outline-offset: 2px; }
  button.stop { color: var(--bad); }
  main { flex: 1; display: flex; min-height: 0; }
  #left { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #conv { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px; }
  .msg { max-width: 820px; margin: 0 0 14px; white-space: pre-wrap; overflow-wrap: anywhere; padding: 8px 12px;
         border-radius: 10px; background: var(--panel); border: 1px solid var(--line); border-left-width: 3px; }
  .msg .who { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; margin-bottom: 2px; font-weight: 600; }
  .msg.you { border-left-color: var(--you); }
  .msg.you .who { color: var(--you); }
  .msg.jarvis { border-left-color: var(--jarvis); }
  .msg.jarvis .who { color: var(--jarvis); }
  .msg.note { color: var(--dim); font-size: 13px; background: none; border: 0; padding: 0 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; max-width: 820px; margin: -6px 0 14px 12px; }
  .chip { font-size: 12px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 10px;
          color: var(--dim); max-width: 100%; }
  .chip summary { cursor: pointer; list-style: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 22px; line-height: 22px; }
  .chip summary::-webkit-details-marker { display: none; }
  .chip[open] { flex-basis: 100%; border-radius: 10px; }
  .chip[open] summary { white-space: normal; }
  .chip .full { padding: 2px 0 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--text); overflow-wrap: anywhere; white-space: pre-wrap; }
  .chip .ic { display: inline-block; width: 1.3em; text-align: center; }
  .chip.ok .ic { color: var(--ok); }
  .chip.err .ic { color: var(--bad); }
  .chip.err { border-color: var(--bad); }
  form { display: flex; align-items: flex-end; gap: 8px; padding: 12px 16px; flex: 0 0 auto; border-top: 1px solid var(--line); background: var(--panel); }
  #text { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--line);
          border-radius: 8px; padding: 8px 10px; font: inherit; resize: none; }
  #form button { min-height: 44px; }
  #dictToggle { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  #dictToggle .ic { font-size: 18px; line-height: 1; }
  #text { min-height: 44px; max-height: 30vh; }
  #text:focus { outline: none; border-color: var(--you); }
  aside { width: 360px; border-left: 1px solid var(--line); overflow-y: auto; overscroll-behavior: contain; padding: 12px 14px; background: var(--bg); }
  aside h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 16px 0 6px; font-weight: 600; }
  aside h2:first-child { margin-top: 0; }
  .empty { color: var(--dim); font-size: 13px; }
  .task { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; margin-bottom: 8px; cursor: pointer; }
  .task:hover { border-color: var(--dim); }
  .task .top { display: flex; align-items: center; gap: 8px; }
  .task .name { flex: 1; font-weight: 600; overflow-wrap: anywhere; }
  .task .act { color: var(--dim); font-size: 13px; overflow-wrap: anywhere; }
  .task .meta { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12px; color: var(--dim); }
  .badge { font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .badge.running { color: var(--warn); border-color: var(--warn); }
  .badge.done { color: var(--ok); border-color: var(--ok); }
  .badge.failed { color: var(--bad); border-color: var(--bad); }
  .badge.stopped { color: var(--stop); border-color: var(--stop); }
  /* timeline: bar styles differ by pattern/ending as well as color, so status is not color-only */
  #timeline { margin-bottom: 8px; }
  .tlrow { display: grid; grid-template-columns: 116px 1fr; gap: 6px; align-items: center; width: 100%; text-align: left;
           background: none; border: 0; border-radius: 6px; padding: 0 2px; min-height: 28px; }
  .tlrow:hover { background: var(--panel); }
  .tlrow .lbl { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tlrow .track { position: relative; height: 14px; background: var(--panel2); border-radius: 4px; }
  .tlrow .bar { position: absolute; top: 2px; bottom: 2px; border-radius: 3px; min-width: 4px; }
  .bar.running { background: repeating-linear-gradient(45deg, var(--warn) 0 5px, transparent 5px 8px); border: 1px solid var(--warn); }
  .bar.done { background: var(--ok); }
  .bar.failed { background: transparent; border: 2px dashed var(--bad); }
  .bar.stopped { background: transparent; border: 2px solid var(--stop); }
  .tlaxis { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); padding-left: 122px; }
  #perm { border: 1px solid var(--warn); border-left-width: 4px; border-radius: 10px; padding: 10px 12px; background: var(--panel); font-size: 13px; overflow-wrap: anywhere; }
  #perm .ptitle { color: var(--warn); font-weight: 700; margin-bottom: 6px; }
  #perm .what { margin-bottom: 6px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; background: var(--panel2);
                border-radius: 6px; padding: 6px 8px; white-space: pre-wrap; }
  #perm .row { display: flex; gap: 8px; margin-top: 8px; }
  #perm .row button { flex: 1; min-height: 44px; font-size: 15px; font-weight: 600; }
  #perm button.approve { color: var(--ok); border-color: var(--ok); }
  #perm button.deny { color: var(--bad); border-color: var(--bad); }
  #perm .note { color: var(--dim); margin-top: 6px; }
  #perm .voice { color: var(--warn); font-weight: 600; margin-top: 6px; }
  /* usage bars: status shown by text as well as colour */
  .pill.voice-off { color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .pill.conv-off { color: var(--warn); border-color: var(--warn); font-weight: 600; }
  .pill.dictating { color: var(--bad); border-color: var(--bad); font-weight: 600; }
  .pill.dictating::before { content: "\25CF "; }
  .pill.dict-finishing { color: var(--warn); border-color: var(--warn); }
  button.dictating { color: var(--bad); border-color: var(--bad); font-weight: 600; }
  #searchbar { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #search { flex: 1; min-width: 0; background: var(--bg); color: var(--text); border: 1px solid var(--line); border-radius: 8px;
            padding: 5px 10px; font: inherit; font-size: 16px; }
  #search:focus { outline: none; border-color: var(--you); }
  #searchCount { font-size: 12px; color: var(--dim); white-space: nowrap; }
  .jv-math { white-space: normal; }
  .jv-math.jv-display { display: block; text-align: center; overflow-x: auto; overflow-y: hidden; margin: 6px 0; }
  .jv-math-error { font-family: ui-monospace, Consolas, monospace; font-size: .92em; white-space: pre-wrap; }
  mark { background: var(--warn); color: #000; border-radius: 3px; padding: 0 1px; }
  .pill.usage-warn { color: var(--warn); border-color: var(--warn); }
  .pill.usage-bad { color: var(--bad); border-color: var(--bad); }
  .urow { margin-bottom: 10px; }
  .urow .utop { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
  .urow .utrack { height: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; overflow: hidden; margin: 3px 0; }
  .urow .ufill { height: 100%; width: 0; background: var(--ok); }
  .urow.warn .ufill { background: var(--warn); }
  .urow.bad .ufill { background: var(--bad); }
  .urow.warn .upct { color: var(--warn); }
  .urow.bad .upct { color: var(--bad); }
  .urow .usub { font-size: 12px; color: var(--dim); }
  .feed { font-size: 12.5px; color: var(--dim); }
  .feed div { padding: 1px 0; overflow-wrap: anywhere; }
  .feed .err { color: var(--bad); }
  .hidden { display: none !important; }
  /* agent detail: drawer on desktop, full-screen sheet on phones */
  #scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 10; }
  #detail { position: fixed; top: 0; right: 0; bottom: 0; width: min(540px, 100%); z-index: 11; background: var(--bg);
            border-left: 1px solid var(--line); box-shadow: var(--shadow); display: flex; flex-direction: column;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) 0; }
  #detail .dhead { display: flex; gap: 10px; align-items: flex-start; padding: 14px 16px 8px; border-bottom: 1px solid var(--line); background: var(--panel); }
  #detail h2 { margin: 0; font-size: 17px; overflow-wrap: anywhere; }
  #detail .dsub { color: var(--dim); font-size: 12.5px; }
  #detail .dmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 16px; font-size: 13px; color: var(--dim); }
  #detail .dactions { display: flex; align-items: center; gap: 10px; padding: 0 16px 8px; }
  #detail h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: var(--dim); margin: 8px 16px 4px; font-weight: 600; }
  #dFeed { flex: 1; min-height: 80px; overflow-y: auto; margin: 0 16px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); padding: 4px 0; }
  #dFeed .it { display: grid; grid-template-columns: 46px 1fr 20px; gap: 6px; padding: 3px 10px; font-size: 13px; }
  #dFeed .it .tm { color: var(--dim); font-variant-numeric: tabular-nums; }
  #dFeed .it .ds { overflow-wrap: anywhere; }
  #dFeed .it .rs.ok { color: var(--ok); }
  #dFeed .it .rs.err { color: var(--bad); }
  #dFeed .it .rs.run { color: var(--warn); }
  #dSummary { margin: 0 16px 16px; padding: 8px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
              white-space: pre-wrap; overflow-wrap: anywhere; max-height: 30%; overflow-y: auto; font-size: 13.5px; }
  @media (pointer: coarse) { button { min-height: 44px; padding: 6px 14px; } .tlrow { min-height: 44px; } .chip summary { min-height: 32px; line-height: 32px; } }
  #text { font-size: 16px; }   /* 16px stops iOS Safari zooming the page when the box is focused */
  #details { display: none; }
  @media (max-width: 520px) {
    header { padding: 6px 10px; gap: 4px 8px; }
    header h1 { font-size: 14px; }
    #form { padding: 8px 10px; }
    #dictToggle .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    #dictToggle { min-width: 44px; padding: 6px 10px; }
    #searchbar { padding: 6px 10px; }
    .urow .utop { flex-wrap: wrap; }
  }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #left { display: contents; }   /* searchbar, chat and input become direct children of main, so the input stays last */
    aside { display: none; width: auto; border-left: 0; border-bottom: 1px solid var(--line); max-height: 40%; flex: 0 0 auto; order: -1; }
    body.show-details aside { display: block; }   /* agents / usage / permission panel: opened with the Details button */
    #details { display: inline-block; }
    header button, #form button, #searchClear { min-height: 44px; }
    header h1 { flex: 0 0 auto; }
    header .status { flex: 1 1 0; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    header .status::-webkit-scrollbar { display: none; }
    header .status .pill { flex: 0 0 auto; }
    header .grow { display: none; }
    header .ctrls { flex: 1 0 100%; flex-wrap: nowrap; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; }
    header .ctrls::-webkit-scrollbar { display: none; }
    header .ctrls button { flex: 0 0 auto; white-space: nowrap; }
    header .ctrls #stopSpeech { order: -2; }   /* urgent controls first in the scrolling row */
    header .ctrls #interrupt { order: -1; }
    #detail { width: 100%; border-left: 0; }
  }
  @media (prefers-reduced-motion: no-preference) { .bar.running { animation: pulse 2s ease-in-out infinite; } }
  @keyframes pulse { 50% { opacity: .65; } }
</style>

<body>
<header>
  <h1>JARVIS</h1>
  <div class="status">
    <span id="mode" class="pill idle" role="status" aria-label="Jarvis is idle">idle</span>
    <span id="voicePill" class="pill" role="status" aria-label="Jarvis's voice is on" title="Jarvis speaks aloud">Voice on</span>
    <span id="convPill" class="pill" role="status" aria-label="Conversation mode is on" title="After a reply Jarvis listens for your answer without the wake word">Conversation on</span>
    <span id="dictPill" class="pill dictating hidden" role="status" aria-label="Dictating" title="Recording your speech from the PC microphone until you stop"></span>
    <span id="usagePill" class="pill hidden" role="status" title="Current 5-hour session usage"></span>
    <span id="conn" class="pill">connecting</span>
  </div>
  <span class="grow"></span>
  <div class="ctrls">
    <button id="theme" type="button" title="Switch dark / light theme" aria-label="Switch theme">Theme</button>
    <button id="voiceToggle" type="button" aria-pressed="false" title="Turn Jarvis's voice off or on (listening stays on)">Mute voice</button>
    <button id="convToggle" type="button" aria-pressed="true" title="Conversation mode: after Jarvis speaks he listens for your answer, no wake word needed. Off: say the wake word each time">Turn conversation off</button>
    <button id="details" type="button" aria-pressed="false" title="Show or hide permission requests, usage, agents and activity">Details</button>
    <button id="stopSpeech" type="button" title="Stop the current speech">Stop speaking</button>
    <button id="interrupt" type="button" class="stop" title="Interrupt the whole current turn">Interrupt turn</button>
  </div>
</header>
<main>
  <div id="left">
    <div id="searchbar" role="search">
      <input id="search" type="search" placeholder="Search the conversation" aria-label="Search the conversation" autocomplete="off" spellcheck="false">
      <span id="searchCount" aria-live="polite"></span>
      <button id="searchClear" type="button" class="hidden" aria-label="Clear search">Clear</button>
    </div>
    <div id="conv" role="log" aria-label="Conversation" aria-live="polite"></div>
    <form id="form" autocomplete="off">
      <button id="dictToggle" type="button" aria-pressed="false" aria-label="Start dictation" title="Record your speech from the PC microphone, ignoring pauses, and send it as one message when you stop"><span class="ic" aria-hidden="true">&#127908;</span><span class="lbl">Start dictation</span></button>
      <textarea id="text" rows="1" enterkeyhint="send" autocapitalize="sentences" placeholder="Type or dictate to Jarvis" aria-label="Message to Jarvis"></textarea>
      <button type="submit">Send</button>
    </form>
  </div>
  <aside>
    <h2>Permission request</h2>
    <div id="permNone" class="empty">None pending.</div>
    <div id="perm" class="hidden" aria-live="assertive"></div>
    <div id="permNote" class="empty hidden"></div>
    <h2>Usage</h2>
    <div id="usage"></div>
    <h2>Timeline</h2>
    <div id="timeline"></div>
    <h2>Agents</h2>
    <div id="agents"></div>
    <h2>Recent activity</h2>
    <div id="feed" class="feed"></div>
  </aside>
</main>
<div id="scrim" class="hidden"></div>
<section id="detail" class="hidden" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dhead">
    <div class="grow"><h2 id="dTitle"></h2><div id="dSub" class="dsub"></div></div>
    <button id="dClose" type="button" aria-label="Close agent details">Close</button>
  </div>
  <div class="dmeta"><span id="dBadge"></span><span id="dKind"></span><span>Elapsed <b id="dEl">0:00</b></span><span id="dTools"></span></div>
  <div class="dactions"><button id="dStop" type="button" class="stop">Stop this agent</button><span id="dMsg" class="empty" aria-live="polite"></span></div>
  <h3>Activity</h3>
  <div id="dFeed" tabindex="0" role="log" aria-label="Agent tool calls, newest at the bottom"></div>
  <div id="dSumWrap" class="hidden"><h3>Summary</h3><div id="dSummary"></div></div>
</section>
<script src="/vendor/katex/katex.min.js"></script>
<script src="/vendor/jarvis-math.js"></script>
<script>
"use strict";
(function () {
  var params = new URLSearchParams(location.search);
  // The token is only in the URL on the first visit; after that the HttpOnly session cookie (same origin,
  // sent automatically by fetch and EventSource) authenticates, so an empty token here is normal.
  var token = params.get("token") || "";
  var $ = function (id) { return document.getElementById(id); };
  var conv = $("conv"), agentsEl = $("agents"), feedEl = $("feed"), tlEl = $("timeline");
  var tasks = {}, dispatches = {}, earlyFeed = {}, lastSeq = 0, clockSkew = 0, es = null, retry = 0;
  var FEED_MAX = 40, TASK_FEED_MAX = 200;
  var ICON = { running: "▶", done: "✓", failed: "✕", stopped: "■" };

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined && text !== null) e.textContent = String(text);   // text only, never HTML
    return e;
  }

  // ---- theme (dark / light; saved in localStorage; default follows the system) ----
  var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: light)") : null;
  function storedTheme() { try { return localStorage.getItem("jarvis-theme"); } catch (x) { return null; } }
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("theme").textContent = t === "light" ? "Dark theme" : "Light theme";
  }
  applyTheme(storedTheme() || (mq && mq.matches ? "light" : "dark"));
  if (mq && mq.addEventListener) mq.addEventListener("change", function () { if (!storedTheme()) applyTheme(mq.matches ? "light" : "dark"); });
  $("theme").addEventListener("click", function () {
    var next = document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
    try { localStorage.setItem("jarvis-theme", next); } catch (x) {}
    applyTheme(next);
  });

  // keep the header and input inside the visible area when the phone keyboard opens (visual viewport)
  (function () {
    var vv = window.visualViewport;
    if (!vv) return;
    function fit() {
      document.documentElement.style.setProperty("--vvh", Math.round(vv.height) + "px");
      document.body.style.transform = vv.offsetTop ? "translateY(" + Math.round(vv.offsetTop) + "px)" : "";
      if (window.scrollY) window.scrollTo(0, 0);
    }
    vv.addEventListener("resize", fit); vv.addEventListener("scroll", fit);
    fit();
  })();

  function api(path, body) {
    return fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis-Token": token },
                         body: JSON.stringify(body || {}) })
      .then(function (r) { return r.json().catch(function () { return { ok: r.ok }; }); })
      .catch(function (e) { return { ok: false, message: String(e) }; });
  }

  // ---- conversation ----
  var chipBox = null, chipsById = {};
  function nearBottom(e) { return e.scrollHeight - e.scrollTop - e.clientHeight < 80; }

    if (stick) f.scrollTop = f.scrollHeight;
    var sum = t.summary || "";
    $("dSumWrap").classList.toggle("hidden", t.status === "running" || !sum);
    $("dSummary").textContent = sum;
  }
  $("dClose").addEventListener("click", closeDetail);
  $("scrim").addEventListener("click", closeDetail);
  $("dStop").addEventListener("click", function () { if (tasks[openId]) stopTask(tasks[openId], $("dStop"), $("dMsg")); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && openId) closeDetail(); });

  // ---- events ----
  function pushFeed(t, entry) {
    t.feed = t.feed || [];
    t.feed.push(entry);
    if (t.feed.length > TASK_FEED_MAX) t.feed.splice(0, t.feed.length - TASK_FEED_MAX);
  }
  var firstSnap = true;
  function applySnapshot(s) {
    var keepPos = !firstSnap && !nearBottom(conv), prevTop = conv.scrollTop;   // reconnect: don't yank a reader to the bottom
    firstSnap = false;
    clockSkew = s.ts * 1000 - Date.now();
    lastSeq = s.seq;
    conv.textContent = ""; feedEl.textContent = ""; tasks = {}; chipBox = null; chipsById = {}; earlyFeed = {};
    // conversation lines and the main agent's recent tool chips, interleaved by event order (seq)
    var items = (s.conversation || []).map(function (c) { return { seq: c.seq || 0, c: c }; })
      .concat((s.recent_tools || []).map(function (r) { return { seq: r.seq || 0, r: r }; }));
    items.sort(function (a, b) { return a.seq - b.seq; });
    items.forEach(function (it) {
      if (it.c) { addMsg(it.c.role, it.c.text); return; }
      addChip({ label: it.r.label, name: it.r.name, description: it.r.description, tool_use_id: it.r.id });
      if (it.r.ok !== null && it.r.ok !== undefined && it.r.id) markChip(it.r.id, !it.r.ok);
    });
    (s.tasks || []).forEach(function (t) { t.feed = t.feed || []; tasks[t.task_id] = t; });
    setMode(s.mode || "idle");
    setVoice(s.voice_muted);
    setConversation(s.conversation_mode);
    setDictation(s.dictation);
    setPerm(s.pending_permission);
    usage = s.usage || {};
    renderUsage();
    renderAgents();
    conv.scrollTop = keepPos ? prevTop : conv.scrollHeight;
  }
  function applyEvent(ev) {
    if (ev.seq <= lastSeq) return;
    lastSeq = ev.seq;
    var t;
    switch (ev.kind) {
      case "conversation": addMsg(ev.role, ev.text); break;
      case "mode": setMode(ev.mode); break;
      case "voice": setVoice(ev.muted); break;
      case "conversation_mode": setConversation(ev.on); break;
      case "dictation": setDictation(ev); break;
      case "agent_dispatch": if (ev.tool_use_id) dispatches[ev.tool_use_id] = ev; addFeed("agent: " + (ev.description || ev.subagent_type || "")); break;
      case "tool_use":
        addFeed(ev.label || ev.description || ev.name);
        if (!ev.parent) { addChip(ev); break; }
        var entry = { ts: ev.ts, tool: ev.name || "", description: ev.label || ev.description || ev.name || "", id: ev.tool_use_id, ok: null };
        var linked = false;
        Object.keys(tasks).forEach(function (k) {
          if (tasks[k].tool_use_id === ev.parent) {
            linked = true;
            pushFeed(tasks[k], entry);
            if (tasks[k].status === "running") tasks[k].activity = entry.description;
          }
        });
        if (!linked) { (earlyFeed[ev.parent] = earlyFeed[ev.parent] || []).push(entry); }
        renderAgents();
        break;
      case "tool_result":
        if (!ev.parent) { markChip(ev.tool_use_id, ev.is_error); break; }
        Object.keys(tasks).forEach(function (k) {
          (tasks[k].feed || []).forEach(function (e) { if (e.id === ev.tool_use_id) e.ok = !ev.is_error; });
        });
        queueDetail();
        break;
      case "task_started":
        var d = dispatches[ev.tool_use_id] || {};
        var nm = ev.description || d.description || ev.task_id;
        tasks[ev.task_id] = { task_id: ev.task_id, name: nm, description: nm, kind: ev.task_kind || "", activity: "",
                              status: "running", started_at: ev.ts, finished_at: null, tool_use_id: ev.tool_use_id,
                              parent: d.parent || null, subagent_type: d.subagent_type || null, summary: "",
                              feed: (ev.tool_use_id && earlyFeed[ev.tool_use_id]) || [] };
        if (ev.tool_use_id) delete earlyFeed[ev.tool_use_id];
        renderAgents(); break;
      case "task_progress":
        t = tasks[ev.task_id];
        if (t && t.status === "running") { t.activity = ev.activity || ev.description || t.activity; renderAgents(); }
        break;
      case "task_done":
        t = tasks[ev.task_id];
        if (t && t.status === "running") { t.status = ev.status || "done"; t.finished_at = ev.ts; t.summary = ev.summary || ""; renderAgents(); }
        break;
      case "narration": if (ev.level === "activity") addFeed(ev.text); break;
      case "permission_request": setPerm({ tool: ev.tool, summary: ev.summary, id: ev.id, voice_only: ev.voice_only, expires_ts: ev.expires_ts }); break;
      case "permission_result":
        setPerm(null);
        addFeed("permission " + (ev.allowed ? "allowed" : "denied") + (ev.by ? " by " + ev.by : "") + ": " + (ev.tool || ""));
        if (ev.by === "voice") showPermNote("Handled by voice");
        else if (ev.by === "web") showPermNote(ev.allowed ? "Approved from the web page." : "Denied from the web page.");
        break;
      case "usage": usage[ev.type || "five_hour"] = ev; renderUsage(); break;
      case "error": addFeed(ev.text, "err"); break;
    }
  }

  var reconnectTimer = null;
  function setConn(state, label) { var c = $("conn"); c.className = "pill " + state; c.id = "conn"; c.textContent = label; }
  function connect() {
    clearTimeout(reconnectTimer); reconnectTimer = null;
    if (es) { es.onerror = es.onopen = null; es.close(); es = null; }
    var q = [];
    if (token) q.push("token=" + encodeURIComponent(token));
    if (lastSeq > 0) q.push("since=" + lastSeq);
    var url = "/events" + (q.length ? "?" + q.join("&") : "");   // relative: works behind an https proxy
    setConn("wait", retry ? "reconnecting" : "connecting");
    var mine = es = new EventSource(url);
    es.onopen = function () { retry = 0; setConn("on", "connected"); };
    es.addEventListener("snapshot", function (e) { try { applySnapshot(JSON.parse(e.data)); } catch (x) {} });
    es.addEventListener("bus", function (e) { try { applyEvent(JSON.parse(e.data)); } catch (x) {} });
    es.onerror = function () {
      if (es !== mine) return;
      es.onerror = es.onopen = null; es.close(); es = null;
      retry++;
      setConn("", "disconnected (retrying; if Jarvis restarted, reopen the link)");
      reconnectTimer = setTimeout(connect, Math.min(1000 * retry, 5000));
    };
  }
  // iOS Safari freezes or kills the stream while the page is in the background: when it comes back,
  // reconnect at once with since=lastSeq (missed events are replayed, or a fresh snapshot is sent).
  function resume() { if (document.visibilityState !== "hidden") { retry = 0; connect(); } }
  document.addEventListener("visibilitychange", resume);
  window.addEventListener("pageshow", function (e) { if (e.persisted) resume(); });
  window.addEventListener("online", resume);

  // ---- input ----
  var box = $("text");
  function send() {
    var text = box.value.trim();
    if (!text) return;
    box.value = "";
    api("/send", { text: text }).then(function (r) { if (!r || r.ok === false) addNote("Not sent: " + ((r && (r.error || r.message)) || "unknown error")); });
  }
  $("form").addEventListener("submit", function (e) { e.preventDefault(); send(); });
  box.addEventListener("keydown", function (e) { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  $("stopSpeech").addEventListener("click", function () { api("/stop-speech"); });
  $("voiceToggle").addEventListener("click", function () {
    api("/voice", { muted: !voiceMuted }).then(function (r) {
      if (r && r.ok === true) setVoice(r.muted);
      else addNote("Voice setting not changed: " + ((r && (r.error || r.message)) || "unknown error"));
    });
  });
  $("convToggle").addEventListener("click", function () {
    api("/conversation", { on: !convOn }).then(function (r) {
      if (r && r.ok === true) setConversation(r.on);
      else addNote("Conversation mode not changed: " + ((r && (r.error || r.message)) || "unknown error"));
    });
  });
  $("dictToggle").addEventListener("click", function () {
    dictBusy = true; setDictation(dict);   // the "dictation" event (not this reply) updates the button and pill
    api("/dictation", { on: !dict.on }).then(function (r) {
      dictBusy = false; setDictation(dict);
      if (!r || r.ok !== true) addNote("Dictation not changed: " + ((r && (r.error || r.message)) || "unknown error"));
    });
  });
  $("interrupt").addEventListener("click", function () {
    api("/cancel", {}).then(function (r) { addFeed((r && r.message) || "interrupt requested", r && r.ok === false ? "err" : ""); });
  });

  renderAgents();
  renderUsage();
  connect();
})();
</script>
</body>
</html>
